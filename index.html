<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa Icaraí</title>
  <meta name="description" content="Casa para Alugar no Icarai">
  <meta name="keywords" content="Lazer, aluguel, Casa.">
  <meta name="author" content="Marcos Vinicius">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style-icarai.css">
  <link rel="stylesheet" href="css-style.css">
</head>

<body>
  <header>
    <nav>
      <a class="logo">Casa Icaraí</a>
      <div class="mobile-menu">
        <div class="line1"></div>
        <div class="line2"></div>
        <div class="line3"></div>
      </div>
      <ul class="nav-list">
        <li><a href="#inicio">Início</a></li>
        <li><a href="https://wa.me/+5585987120140" target="_blank">WhatsApp</a></li>
        <li><a href="https://www.instagram.com/###/#" target="_blank">Instagram</a></li>
        <li><a href="#cadastrar">Cadastrar</a></li>
      </ul>
    </nav>
  </header>
  <script src="mobile-navbar.js"></script>

  <section class="fotos" id="inicio" style="margin-top: 100px;">
    <div class="text">
      <p class="text-font">Fotos casa Icaraí</p>
    </div>
    <div class="carousel-container text-um">
      <button class="prev">&#10094;</button>
      <div class="carousel">
        <img src="imagem/img-casa-01.png" alt="Imagem 1" class="active" />
        <img src="imagem/img-casa-02.png" alt="Imagem 2" />
        <img src="imagem/img-casa-03.png" alt="Imagem 3" />
        <img src="imagem/img-casa-04.png" alt="Imagem 4" />
        <img src="imagem/img-casa-05.png" alt="Imagem 5" />
        <img src="imagem/img-casa-06.png" alt="Imagem 6" />
      </div>
      <button class="next">&#10095;</button>
      <div class="indicators">
        <span class="dot active" data-index="0"></span>
        <span class="dot" data-index="1"></span>
        <span class="dot" data-index="2"></span>
        <span class="dot" data-index="3"></span>
        <span class="dot" data-index="4"></span>
        <span class="dot" data-index="5"></span>
        <span class="dot" data-index="6"></span>
      </div>
    </div>
  </section>
  <script src="carscript.js"></script> <!-- Script do Carrocel -->

  <section class="section" id="data-aluguel">
    <h1>TABELA ICARAÍ</h1>
    <!-- 12 Tabelas (Janeiro a Dezembro) -->
    <div id="tabelas"></div>
    <!-- Formulário -->
    <form id="formReserva">
      <div>
        <label for="mes">Mês:</label><br>
        <select id="mes" required>
          <option value="">Selecione o mês</option>
          <option value="janeiro">Janeiro</option>
          <option value="fevereiro">Fevereiro</option>
          <option value="marco">Março</option>
          <option value="abril">Abril</option>
          <option value="maio">Maio</option>
          <option value="junho">Junho</option>
          <option value="julho">Julho</option>
          <option value="agosto">Agosto</option>
          <option value="setembro">Setembro</option>
          <option value="outubro">Outubro</option>
          <option value="novembro">Novembro</option>
          <option value="dezembro">Dezembro</option>
        </select>
      </div>
      <div id="cadastrar">
        <label for="data">Data:</label>
        <input type="text" id="data" placeholder="dd/mm a dd/mm">
      </div>
      <div>
        <label for="est">Est:</label>
        <input type="text" id="est">
      </div>
      <div>
        <label for="valor">Valor:</label>
        <input type="text" id="valor">
      </div>
      <div>
        <label for="nome">Nome:</label>
        <input type="text" id="nome">
      </div>
      <button type="submit">Enviar dados</button>
    </form>
    <script src="js-icarai.js"></script>
  </section>

</body>

</html>
